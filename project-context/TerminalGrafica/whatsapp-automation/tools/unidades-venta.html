<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unidades de venta — catálogo TG</title>
<!--
  DECISOR DE UNIDADES DE VENTA (entrega 0 — atomización del catálogo).
  Self-contained: los datos del catálogo van embebidos, no hay backend ni fetch.

  Para qué: en el sistema del mostrador, 143 de 180 variantes tienen "Hoja" como
  unidad por herencia, incluidas lonas, carteles, anillados y porta banners. Ese
  campo hace DOS trabajos: lo que el bot dice ("por hoja", "el m²") y —lo que
  importa— si el número que da el cliente multiplica el precio. De ahí salieron
  los bugs de plata V2 y V3.

  Cómo se usa: elegí la unidad correcta de cada producto (viene con una sugerida),
  ajustá si multiplica o no, y marcá con "?" lo que haya que preguntarle a TG.
  El progreso se guarda solo en localStorage. "Exportar JSON" baja las decisiones
  para que Claude arme el SQL de curación.

  Los productos con unidades MEZCLADAS entre sus variantes aparecen desglosados
  variante por variante (son los carteles: una variante dice Hoja y otra m²).
-->
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1c1b1a; --mut:#6b675f; --line:#dad6cd;
          --acc:#C2255C; --ok:#2b8a3e; --warn:#e8590c; --bad:#c92a2a; --chip:#efece6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191817; --panel:#211f1e; --ink:#ece9e4; --mut:#a09a90; --line:#3a3733;
            --acc:#f06595; --ok:#69db7c; --warn:#ffa94d; --bad:#ff8787; --chip:#2e2c29; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:2px solid var(--acc);
           background:var(--panel); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 10px 0 0; }
  .prog { color:var(--mut); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .prog b { color:var(--ink); }
  .spacer { flex:1 }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); background:var(--panel);
           color:var(--ink); border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  input[type=search] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px;
                       background:var(--panel); color:var(--ink); min-width:200px; }
  input[type=search]:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }

  .toolbar { display:flex; gap:8px; align-items:center; padding:9px 16px; border-bottom:1px solid var(--line);
             background:var(--panel); position:sticky; top:53px; z-index:4; flex-wrap:wrap; font-size:13px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:5px 11px; font-size:13px; }
  .seg button[aria-pressed="true"] { background:var(--acc); color:#fff; }

  main { padding:14px 16px 90px; max-width:1180px; margin:0 auto; }
  h2.rub { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--mut);
           margin:22px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  h2.rub:first-child { margin-top:4px; }

  .row { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
         margin-bottom:7px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 14px; align-items:start; }
  .row.done { border-left:3px solid var(--ok); }
  .row.tg { border-left:3px solid var(--warn); }
  .row .nm { font-weight:600; font-size:13.5px; }
  .row .vr { color:var(--acc); font-weight:600; }
  .meta { color:var(--mut); font-size:11.5px; margin-top:3px; display:flex; gap:10px; flex-wrap:wrap;
          font-variant-numeric:tabular-nums; }
  .meta .act { background:var(--chip); border-radius:4px; padding:1px 6px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .meta .why { font-style:italic; }
  .flag { display:inline-block; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
          border:1px solid var(--line); border-radius:3px; padding:0 4px; color:var(--mut); }

  .ctrl { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .units { display:flex; gap:4px; flex-wrap:wrap; }
  .u { padding:4px 9px; font-size:12.5px; border-radius:5px; border:1px solid var(--line);
       background:var(--panel); cursor:pointer; white-space:nowrap; }
  .u[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .u.sug { border-color:var(--acc); border-style:dashed; }
  .u.sug[aria-pressed="true"] { background:var(--acc); border-color:var(--acc); border-style:solid; color:#fff; }
  .mul { font-size:11.5px; color:var(--mut); display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .mul button { padding:3px 8px; font-size:11.5px; }
  .mul button[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .ask { padding:4px 9px; font-size:12.5px; }
  .ask[aria-pressed="true"] { background:var(--warn); border-color:var(--warn); color:#fff; }

  footer { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line);
           padding:9px 16px; display:flex; gap:9px; align-items:center; flex-wrap:wrap; z-index:6; }
  .hint { color:var(--mut); font-size:11.5px; }
  .empty { color:var(--mut); padding:40px; text-align:center; }
  @media (max-width:760px){ .row { grid-template-columns:1fr; } .ctrl { justify-content:flex-start; } }
</style>
</head>
<body>

<header>
  <h1>Unidades de venta</h1>
  <span class="prog" id="prog"></span>
  <span class="spacer"></span>
  <button id="acceptAll">Aceptar todas las sugeridas</button>
  <button id="acceptView">Aceptar las visibles</button>
  <button id="reset">Empezar de cero</button>
</header>

<div class="toolbar">
  <div class="seg" role="group" aria-label="Filtro">
    <button data-f="pend" aria-pressed="true">Pendientes</button>
    <button data-f="susp" aria-pressed="false">Sospechosos</button>
    <button data-f="tg" aria-pressed="false">Para TG</button>
    <button data-f="all" aria-pressed="false">Todos</button>
  </div>
  <input type="search" id="q" placeholder="Buscar producto o rubro" aria-label="Buscar">
  <span class="hint" id="count"></span>
</div>

<main id="list"></main>

<footer>
  <button class="primary" id="exportJson">Exportar JSON</button>
  <button id="copyJson">Copiar al portapapeles</button>
  <span class="hint" id="status"></span>
  <span class="spacer"></span>
  <span class="hint">Se guarda solo en este navegador. Sospechoso = la unidad cargada no se corresponde con lo que se vende.</span>
</footer>

Hoja"},{"prod":"Refilado de libros","rubro":"Taller","pack":false,"pag":false,"sug":"trabajo","why":"servicio: se cobra por trabajo terminado","min":0,"max":0,"nv":1,"vari":null,"act":"Hoja"},{"prod":"Trazado/troquelado manual de papel","rubro":"Taller","pack":false,"pag":false,"sug":"unidad","why":"se cobra por cada uno","min":50,"max":50,"nv":1,"vari":null,"act":"Hoja"}];

const UNIDADES = [
  ['pagina', 'página'],
  ['hoja',   'hoja'],
  ['unidad', 'unidad'],
  ['trabajo','trabajo'],
  ['pack',   'pack'],
  ['m2',     'm²'],
  ['metro',  'metro lineal'],
];
// si el número que da el cliente multiplica el precio de lista, y con qué
const MULT_DEFAULT = { pagina:true, hoja:true, unidad:true, trabajo:true, pack:false, m2:false, metro:false };
const KEY = 'tg-unidades-v1';

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const idOf = r => r.prod + '||' + (r.vari || '');
const fmt = n => '$' + new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(n);
// sospechoso = lo cargado no coincide con lo sugerido
const esSospechoso = r => norm(r.act).replace('metro cuadrado','m2') !== norm(r.sug);

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { state = {}; }
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const get = id => state[id] || {};

let filtro = 'pend', query = '';

function visibles() {
  const q = norm(query);
  return DATA.filter(r => {
    const st = get(idOf(r));
    if (filtro === 'pend' && st.unidad) return false;
    if (filtro === 'susp' && !esSospechoso(r)) return false;
    if (filtro === 'tg'   && !st.tg) return false;
    if (q && !norm(r.prod + ' ' + (r.vari||'') + ' ' + r.rubro).includes(q)) return false;
    return true;
  });
}

function render() {
  const list = document.getElementById('list');
  const rows = visibles();
  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<p class="empty">Nada para mostrar con este filtro.</p>';
  } else {
    let rubro = null;
    for (const r of rows) {
      if (r.rubro !== rubro) {
        rubro = r.rubro;
        const h = document.createElement('h2');
        h.className = 'rub'; h.textContent = rubro;
        list.appendChild(h);
      }
      list.appendChild(fila(r));
    }
  }
  const decid = DATA.filter(r => get(idOf(r)).unidad).length;
  const tg = DATA.filter(r => get(idOf(r)).tg).length;
  document.getElementById('prog').innerHTML =
    '<b>' + decid + '</b> de ' + DATA.length + ' decididos · ' + tg + ' marcados para TG';
  document.getElementById('count').textContent = rows.length + ' en pantalla';
}

function fila(r) {
  const id = idOf(r);
  const st = get(id);
  const el = document.createElement('div');
  el.className = 'row' + (st.unidad ? ' done' : '') + (st.tg ? ' tg' : '');

  const izq = document.createElement('div');
  const nm = document.createElement('div');
  nm.className = 'nm';
  nm.textContent = r.prod;
  if (r.vari) {
    const v = document.createElement('span');
    v.className = 'vr'; v.textContent = '  ·  ' + r.vari;
    nm.appendChild(v);
  }
  izq.appendChild(nm);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const act = document.createElement('span');
  act.className = 'act'; act.textContent = 'cargado: ' + r.act;
  meta.appendChild(act);
  const precio = document.createElement('span');
  precio.textContent = r.vari ? fmt(r.precio)
    : (r.min === r.max ? fmt(r.min) : fmt(r.min) + ' a ' + fmt(r.max) + ' · ' + r.nv + ' opciones');
  meta.appendChild(precio);
  if (r.pack) meta.appendChild(chip('por_pack'));
  if (r.pag)  meta.appendChild(chip('por_pagina'));
  if (esSospechoso(r)) meta.appendChild(chip('sospechoso'));
  const why = document.createElement('span');
  why.className = 'why'; why.textContent = r.why;
  meta.appendChild(why);
  izq.appendChild(meta);
  el.appendChild(izq);

  const ctrl = document.createElement('div');
  ctrl.className = 'ctrl';

  const units = document.createElement('div');
  units.className = 'units';
  for (const [val, label] of UNIDADES) {
    const b = document.createElement('button');
    b.className = 'u' + (val === r.sug ? ' sug' : '');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(st.unidad === val));
    b.title = val === r.sug ? 'Sugerida' : '';
    b.addEventListener('click', () => {
      const cur = get(id);
      if (cur.unidad === val) { delete state[id]; }
      else { state[id] = { unidad: val, multiplica: cur.unidad ? cur.multiplica : MULT_DEFAULT[val], tg: !!cur.tg }; }
      save(); render();
    });
    units.appendChild(b);
  }
  ctrl.appendChild(units);

  if (st.unidad) {
    const mul = document.createElement('span');
    mul.className = 'mul';
    mul.appendChild(document.createTextNode('multiplica'));
    for (const [v, lab] of [[true,'sí'],[false,'no']]) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = lab;
      b.setAttribute('aria-pressed', String(!!st.multiplica === v));
      b.addEventListener('click', () => { state[id].multiplica = v; save(); render(); });
      mul.appendChild(b);
    }
    ctrl.appendChild(mul);
  }

  const ask = document.createElement('button');
  ask.className = 'ask'; ask.type = 'button'; ask.textContent = '? TG';
  ask.title = 'Marcar para preguntarle a TG';
  ask.setAttribute('aria-pressed', String(!!st.tg));
  ask.addEventListener('click', () => {
    const cur = get(id);
    state[id] = { unidad: cur.unidad || '', multiplica: cur.multiplica, tg: !cur.tg };
    if (!state[id].unidad && !state[id].tg) delete state[id];
    save(); render();
  });
  ctrl.appendChild(ask);

  el.appendChild(ctrl);
  return el;
}

function chip(t) { const s = document.createElement('span'); s.className = 'flag'; s.textContent = t; return s; }

function aceptar(rows) {
  for (const r of rows) {
    if (!r.sug) continue;
    const id = idOf(r), cur = get(id);
    if (cur.unidad) continue;
    state[id] = { unidad: r.sug, multiplica: MULT_DEFAULT[r.sug], tg: !!cur.tg };
  }
  save(); render();
}

document.getElementById('acceptAll').addEventListener('click', () => aceptar(DATA));
document.getElementById('acceptView').addEventListener('click', () => aceptar(visibles()));
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Se borran todas las decisiones tomadas. ¿Seguro?')) return;
  state = {}; save(); render();
});
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  filtro = b.dataset.f;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });

function payload() {
  const dec = DATA.filter(r => { const s = get(idOf(r)); return s.unidad || s.tg; }).map(r => {
    const s = get(idOf(r));
    return {
      producto: r.prod,
      variante: r.vari,
      rubro: r.rubro,
      unidad_actual: r.act,
      unidad_venta: s.unidad || null,
      multiplica: s.unidad ? !!s.multiplica : null,
      consultar_tg: !!s.tg,
      sugerida: r.sug,
      acepto_sugerida: s.unidad === r.sug,
    };
  });
  return JSON.stringify({
    generado: new Date().toISOString(),
    total_filas: DATA.length,
    decididas: dec.filter(d => d.unidad_venta).length,
    para_tg: dec.filter(d => d.consultar_tg).length,
    decisiones: dec,
  }, null, 2);
}

function flash(msg) {
  const s = document.getElementById('status');
  s.textContent = msg;
  setTimeout(() => { s.textContent = ''; }, 2600);
}

document.getElementById('exportJson').addEventListener('click', () => {
  const blob = new Blob([payload()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'unidades-venta-decisiones.json';
  a.click();
  URL.revokeObjectURL(a.href);
  flash('Archivo generado.');
});
document.getElementById('copyJson').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(payload()); flash('Copiado.'); }
  catch (e) { flash('No se pudo copiar; usá Exportar JSON.'); }
});

render();
</script>
